<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#020202">
  <meta name="robots" content="noindex, follow">
  <title>404 — The Void | The Weeknd Cinematic Experience</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #020202;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      overflow: hidden;
    }
    .void-glow {
      position: absolute;
      width: min(500px, 80vw);
      height: min(500px, 80vw);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(239, 27, 24, 0.22) 0%, transparent 68%);
      filter: blur(40px);
      pointer-events: none;
    }
    .xo {
      font-family: Georgia, serif;
      font-style: italic;
      font-weight: 800;
      font-size: clamp(80px, 18vw, 160px);
      color: #ef1b18;
      letter-spacing: -0.1em;
      line-height: 0.85;
      margin-bottom: 20px;
      text-shadow: 0 0 30px rgba(239, 27, 24, 0.4);
    }
    h1 {
      font-size: clamp(18px, 4vw, 28px);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      font-weight: 400;
      color: #ded8cf;
      margin-bottom: 12px;
    }
    p {
      font-size: clamp(12px, 2.5vw, 14px);
      letter-spacing: 0.1em;
      color: rgba(255, 255, 255, 0.55);
      max-width: 420px;
      margin-bottom: 32px;
      line-height: 1.6;
    }
    a {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 14px 28px;
      min-height: 44px;
      border: 1px solid rgba(239, 27, 24, 0.65);
      background: rgba(239, 27, 24, 0.1);
      color: #ffffff;
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      transition: background 0.25s, transform 0.25s;
    }
    a:hover, a:focus-visible {
      background: #ef1b18;
      transform: translateY(-2px);
      outline: 2px solid #ffffff;
      outline-offset: 3px;
    }
    footer {
      position: absolute;
      bottom: 24px;
      font-size: 10px;
      letter-spacing: 0.15em;
      color: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <div class="void-glow" aria-hidden="true"></div>
  <div class="xo" aria-hidden="true">XO</div>
  <h1>Lost in the Void</h1>
  <p>The chapter you are looking for has faded into the shadows or never existed.</p>
  <a href="index.html#hero">Return to Experience <b>↺</b></a>
  <footer>Unofficial Fan-Made Experience</footer>
</body>
</html>
